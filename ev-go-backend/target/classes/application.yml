# ============================================================
# EV GO Backend – Base Application Configuration
# Profile-specific overrides: application-dev.yml / application-prod.yml
# ============================================================

spring:
  application:
    name: ev-go-backend

  # ── Server ──────────────────────────────────────────────────
  server:
    port: 8081

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/evgo}
    username: ${DB_USER:evgo}
    password: ${DB_PASSWORD:evgo}
    driver-class-name: org.postgresql.Driver

    # HikariCP connection pool
    # Requirements: 3.1 (min/max pool size), 3.2 (connection timeout),
    #               3.5 (prepared statement caching)
    hikari:
      pool-name: EVGoHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 3000          # 3 s – Req 3.2: queue up to 3 s before HTTP 503
      idle-timeout: 600000              # 10 min
      max-lifetime: 1800000             # 30 min
      leak-detection-threshold: 60000   # 60 s – log warning on leaked connections
      keepalive-time: 30000             # 30 s – Req 3.3: validate connections every 30 s

      # Connection validation
      connection-test-query: SELECT 1
      validation-timeout: 5000          # 5 s

      # Prepared statement caching – Req 3.5
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  # ── JPA / Hibernate ───────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate                # Flyway owns schema; Hibernate only validates
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true

  # ── Flyway ────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # ── Redis ─────────────────────────────────────────────────
  # Requirements: 1.3 (distributed locking), 7.1 (Pub/Sub), 9.1 (caching)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 1000ms

  # ── WebSocket ─────────────────────────────────────────────
  websocket:
    message-size-limit: 65536           # 64 KB per message
    send-buffer-size-limit: 524288      # 512 KB send buffer

# ============================================================
# Actuator / Metrics
# Requirements: 21.6 (Prometheus endpoint), 21.7 (Micrometer)
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}   # 10% in prod; override to 1.0 in dev

# ============================================================
# Application-specific settings
# ============================================================
app:
  # JWT – Requirements: 19.1
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-must-be-at-least-256-bits-long}
    access-token-expiry-ms: 86400000    # 24 h
    refresh-token-expiry-ms: 2592000000 # 30 days

  # Claude AI – Requirements: 14.x, 15.x
  claude:
    api-key: ${CLAUDE_API_KEY:}
    model: claude-sonnet-4-20250514
    max-tokens: 1000
    timeout-seconds: 10
    token-budget: 8000
    max-conversation-messages: 50

  # Razorpay – Requirements: 4.x, 5.x, 6.x
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

  # Google Maps
  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}

  # CORS – Requirements: 20.1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

  # Caching TTLs – Requirements: 9.1, 9.2
  cache:
    station-details-ttl-seconds: 300    # 5 min
    station-search-ttl-seconds: 120     # 2 min
    tool-result-ttl-seconds: 300        # 5 min – Req 15.7
    payment-idempotency-ttl-seconds: 86400  # 24 h – Req 5.2
    webhook-idempotency-ttl-seconds: 86400  # 24 h – Req 4.2

  # Booking – Requirements: 1.3, 13.x
  booking:
    lock-ttl-seconds: 10
    lock-wait-seconds: 3
    lock-extend-threshold-seconds: 7
    stale-reservation-threshold-minutes: 10
    stale-cleanup-batch-size: 50

  # Slot generation – Requirements: 10.1
  slot:
    generation-days-ahead: 30

# ============================================================
# Resilience4j – Requirements: 14.x, 16.x
# ============================================================
resilience4j:
  circuitbreaker:
    instances:
      claudeApi:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        register-health-indicator: true
  retry:
    instances:
      claudeApi:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      toolExecution:
        max-attempts: 2
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      razorpayRefund:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      claudeApi:
        timeout-duration: 10s
      toolExecution:
        timeout-duration: 5s

# ============================================================
# Logging – base config; full JSON config in logback-spring.xml
# Requirements: 22.1, 22.3
# ============================================================
logging:
  level:
    root: INFO
    com.evgo: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    com.zaxxer.hikari: INFO
  pattern:
    # Fallback pattern used only when logback-spring.xml is absent
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
