# Test profile configuration for HikariCP tests
# Uses H2 in-memory database for testing

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

    # HikariCP configuration - same as production
    hikari:
      pool-name: EVGoHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
      keepalive-time: 30000
      connection-test-query: SELECT 1
      validation-timeout: 5000
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

# Disable actuator endpoints in tests
management:
  endpoints:
    enabled-by-default: false

# Test-specific application settings
app:
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-testing-purposes
    access-token-expiry-ms: 3600000
    refresh-token-expiry-ms: 86400000
  claude:
    api-key: test-key
    model: claude-sonnet-4-20250514
    max-tokens: 1000
    timeout-seconds: 10
    token-budget: 8000
    max-conversation-messages: 50
  razorpay:
    key-id: test-key-id
    key-secret: test-key-secret
    webhook-secret: test-webhook-secret
  cors:
    allowed-origins: http://localhost:3000
  booking:
    lock-ttl-seconds: 10
    lock-wait-seconds: 3
    lock-extend-threshold-seconds: 7
    stale-reservation-threshold-minutes: 10
    stale-cleanup-batch-size: 50
